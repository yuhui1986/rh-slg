[package]
name = "slg-core"
version.workspace = true
edition.workspace = true

[dependencies]
slg-data = { path = "../slg-data" }
slg-save = { path = "../slg-save" }
serde = { version = "1", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
noise = "0.9"
thiserror = "2"
tracing = "0.1"
lru = "0.12"
ron = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
slg-data = { path = "../slg-data" }

[[bench]]
name = "performance"
harness = false
