[package]
name = "slg-assets"
version.workspace = true
edition.workspace = true

[dependencies]
slg-data = { path = "../slg-data" }
slg-core = { path = "../slg-core" }
ron = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
image = "0.25"
serde_json = "1"

[[bin]]
name = "build_atlas"
path = "src/bin/build_atlas.rs"
