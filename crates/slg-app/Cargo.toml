[package]
name = "slg-app"
version.workspace = true
edition.workspace = true

[dependencies]
slg-data = { path = "../slg-data" }
slg-core = { path = "../slg-core" }
slg-engine = { path = "../slg-engine" }
slg-ui = { path = "../slg-ui" }
slg-editor = { path = "../slg-editor" }
slg-save = { path = "../slg-save" }
slg-assets = { path = "../slg-assets" }
bevy = "0.15"
bevy_egui = "0.33"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Steam 集成（可选）
steamworks = { version = "0.11", optional = true }

[features]
default = []
steam = ["steamworks"]
